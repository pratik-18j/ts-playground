name: Auto-Update README Tree

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tree Command
        run: sudo apt-get install -y tree

      - name: Update README Tree Section
        run: |
          echo '```text' > combined_tree.txt
          tree -L 3 -I '.git|node_modules|combined_tree.txt' >> combined_tree.txt
          echo '```' >> combined_tree.txt
          
          echo '' >> combined_tree.txt
          echo '<details>' >> combined_tree.txt
          echo '<summary>▶ Click here to view all files</summary>' >> combined_tree.txt
          echo '' >> combined_tree.txt
          echo '```text' >> combined_tree.txt
          tree -I '.git|node_modules|combined_tree.txt' >> combined_tree.txt
          echo '```' >> combined_tree.txt
          echo '</details>' >> combined_tree.txt
          
          awk '
            /<!-- START_TREE -->/ {
              print $0
              system("cat combined_tree.txt")
              skip=1
              next
            }
            /<!-- END_TREE -->/ {
              skip=0
            }
            !skip { print $0 }
          ' README.md > temp_readme.md
          
          mv temp_readme.md README.md
          rm combined_tree.txt

      - name: Save and Commit to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: implement hybrid collapsible tree"
          file_pattern: README.md