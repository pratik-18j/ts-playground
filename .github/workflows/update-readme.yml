name: Auto-Update README Tree

# 1. Trigger: When does this run?
on:
  push:
    branches:
      - main

# 2. Permissions: Give the bot permission to save files
permissions:
  contents: write

# 3. Jobs: The actual steps the robot takes
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tree Command
        run: sudo apt-get install -y tree

      # THIS IS THE NEW ENTERPRISE TEMPLATE INJECTION STEP
      - name: Update README Tree Section
        run: |
          tree -I '.git|node_modules' > tree.txt
          awk '
            /<!-- START_TREE -->/ {
              print $0
              print "```text"
              system("cat tree.txt")
              print "```"
              skip=1
              next
            }
            /<!-- END_TREE -->/ {
              skip=0
            }
            !skip { print $0 }
          ' README.md > temp_readme.md
          mv temp_readme.md README.md

      - name: Save and Commit to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update repository tree in README"
          file_pattern: README.md